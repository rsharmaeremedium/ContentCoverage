<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ContentCoverage — MedXplain Specialty Exporter</title>
<meta name="description" content="Browse MedXplain by specialty and export Module &amp; Topic lists (columns 1 &amp; 2) as PDF. Works offline.">
<meta name="theme-color" content="#1a56db">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ContentCoverage">
<style>
  :root{
    --bg:#f4f6fa; --panel:#fff; --line:#e3e8f0; --ink:#16203a;
    --muted:#6b7793; --accent:#1a56db; --accent-ink:#fff; --row-alt:#f8fafd;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}

  header.page-head{background:var(--panel);border-bottom:1px solid var(--line);
    padding:calc(18px + var(--safe-top)) 24px 18px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header.page-head h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
  header.page-head .sub{color:var(--muted);font-size:13px}
  header.page-head .spacer{flex:1}

  .install-btn{display:none;padding:7px 13px;border-radius:7px;border:1px solid var(--accent);
    background:#fff;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .install-btn.show{display:inline-block}
  .install-btn:hover{background:var(--row-alt)}

  .net-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .net-dot i{width:8px;height:8px;border-radius:50%;background:#22a06b;display:inline-block}
  .net-dot.off i{background:#d93025}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 24px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}

  .picker{position:sticky;top:20px;overflow:hidden}
  .picker-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .picker-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
  .link-btn{background:none;border:none;padding:0;cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600}
  .link-btn:hover{text-decoration:underline}

  .search-wrap{padding:10px 16px;border-bottom:1px solid var(--line)}
  .search-wrap input{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--line);
    border-radius:7px;outline:none;background:var(--row-alt);color:var(--ink)}
  .search-wrap input:focus{border-color:var(--accent);background:#fff}

  .items{max-height:46vh;overflow-y:auto;padding:6px}
  .item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;user-select:none}
  .item:hover{background:var(--row-alt)}
  .item input{margin:0;accent-color:var(--accent);cursor:pointer}
  .item .name{flex:1;font-size:13px}
  .item .count{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .item.hidden{display:none}
  .empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}

  .picker-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .picker-foot .stat{font-size:12.5px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:8px;
    cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid transparent;font-family:inherit}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
  .btn-primary:hover{background:#1546b8}
  .btn-primary:disabled{background:#a9b6cf;cursor:not-allowed}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{background:var(--row-alt)}

  .preview-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .preview-head h2{margin:0;font-size:15px;font-weight:650}
  .preview-head .meta{color:var(--muted);font-size:12.5px}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:650;padding:10px 18px;background:var(--row-alt);border-bottom:1px solid var(--line)}
  tbody td{padding:9px 18px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  td.mod{font-weight:600;width:32%}
  td.mod.blank{color:transparent}
  tbody tr:hover td{background:var(--row-alt)}
  .section-sep td{border-top:2px solid var(--line)}

  .print-only{display:none}

  /* ---- PDF layout, matched to the Eremedium reference export ---- */
  @page{size:letter portrait;margin:18mm 28mm 16mm 28mm}

  @media print{
    body{background:#fff;font-size:12pt;color:#000}
    header.page-head,.layout{display:none!important}
    .print-only{display:block}

    .print-block{page-break-before:auto}
    .print-block + .print-block{page-break-before:always}

    /* company header (page 1 only) */
    .doc-head{display:table;width:100%;margin:0 0 1.5mm;vertical-align:bottom}
    .doc-head .logo-cell{display:table-cell;width:36%;vertical-align:bottom;padding:0}
    .doc-head .logo{height:5mm;width:auto;display:block}
    .doc-head .company-cell{display:table-cell;vertical-align:bottom;text-align:center;padding:0}
    .doc-head .company{font-family:"Times New Roman",Times,serif;font-weight:700;line-height:1.05;
      font-size:13pt;color:#000;letter-spacing:.2px}

    /* specialty banner */
    .spec-banner{
      background:#1b4f91 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
      color:#fff;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:12pt;
      text-align:center;padding:1.2mm 3mm;margin:0;
      border:1px solid #000;border-bottom:none;
    }

    /* the table */
    .print-table{width:100%;border-collapse:collapse;font-family:"Times New Roman",Times,serif}
    .print-table thead{display:table-header-group}
    .print-table thead th{
      background:#3d6b1f !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
      color:#fff;font-weight:700;font-size:11pt;text-align:center;line-height:1.1;
      padding:1.4mm 2.5mm;border:1px solid #000;position:static;text-transform:none;letter-spacing:0;
    }
    .print-table thead th.c-mod{width:35%}
    .print-table thead th.c-top{width:65%}

    .print-table tbody td{
      font-size:11pt;line-height:1.1;color:#000;padding:.3mm 2.5mm;border:1px solid #000;
      vertical-align:middle;background:#fff !important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .print-table tbody td.mod{
      font-weight:700;font-size:10pt;text-align:center;vertical-align:middle;width:35%;
    }
    .print-table tbody td.top{text-align:left;vertical-align:middle}

    /* keep single rows intact; a module group may still flow across pages */
    .print-table tbody tr{page-break-inside:avoid}
  }

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:14px}
    .picker{position:static}
    .items{max-height:34vh}
    header.page-head{padding:calc(14px + var(--safe-top)) 14px 14px}
    .picker-foot{padding-bottom:calc(12px + var(--safe-bottom))}
    tbody td,thead th{padding-left:14px;padding-right:14px}
    td.mod{width:40%}
  }
</style>
</head>
<body>

<header class="page-head">
  <h1>ContentCoverage</h1>
  <span class="sub">MedXplain &mdash; columns 1 &amp; 2 (Module, Topic) &middot; each tab = one specialty</span>
  <span class="spacer"></span>
  <span class="net-dot" id="netDot"><i></i><span id="netText">Online</span></span>
  <button class="install-btn" id="installBtn" type="button">Install app</button>
</header>

<div class="layout">
  <aside class="panel picker">
    <div class="picker-head">
      <h2>Choose specialty</h2>
      <button class="link-btn" id="toggleAll" type="button">Clear all</button>
    </div>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Filter specialties&hellip;" autocomplete="off">
    </div>
    <div class="items" id="items"></div>
    <div class="picker-foot">
      <div class="stat" id="stat">&mdash;</div>
      <button class="btn btn-primary" id="exportBtn" type="button">Download PDF for selection</button>
      <button class="btn btn-ghost" id="exportAllBtn" type="button">Download PDF of everything</button>
    </div>
  </aside>

  <main class="panel">
    <div class="preview-head">
      <h2>Preview</h2>
      <span class="meta" id="previewMeta">&mdash;</span>
    </div>
    <table>
      <thead><tr><th scope="col">Module</th><th scope="col">Topic</th></tr></thead>
      <tbody id="previewBody"></tbody>
    </table>
    <div class="empty" id="emptyState" hidden>No specialties selected. Pick one on the left.</div>
  </main>
</div>

<div id="printArea" class="print-only"></div>

  const q = query.trim().toLowerCase();
  const shown = TABS.filter(t=>!q||t.name.toLowerCase().includes(q));
  itemsEl.innerHTML = shown.length ? shown.map(t=>`
    <label class="item" data-name="${esc(t.name)}">
      <input type="checkbox" ${selected.has(t.name)?"checked":""}>
      <span class="name">${esc(t.name)}</span>
      <span class="count">${t.rows.length}</span>
    </label>`).join("")
    : `<div class="empty">No specialties match &ldquo;${esc(query)}&rdquo;.</div>`;
}

itemsEl.addEventListener("change", e=>{
  const box = e.target.closest('input[type="checkbox"]');
  if(!box) return;
  const name = box.closest(".item").dataset.name;
  box.checked ? selected.add(name) : selected.delete(name);
  sync();
});

document.getElementById("search").addEventListener("input", e=>{
  query = e.target.value; renderPicker();
});

toggleAll.addEventListener("click", ()=>{
  const allOn = selected.size === TABS.length;
  selected.clear();
  if(!allOn) TABS.forEach(t=>selected.add(t.name));
  toggleAll.textContent = allOn ? "Select all" : "Clear all";
  renderPicker(); sync();
});

function renderPreview(){
  const chosen = TABS.filter(t=>selected.has(t.name));
  const body   = document.getElementById("previewBody");
  const flat   = [];
  chosen.forEach(t=>t.rows.forEach((r,i)=>flat.push({tab:t.name, first:i===0, mod:r[0], topic:r[1]})));

  body.innerHTML = flat.map((r,i)=>{
    const sep = !r.first && flat[i-1].tab !== r.tab ? " section-sep" : "";
    const mod = r.mod || "";
    const blank = mod ? "" : "blank";
    return `<tr class="${sep}"><td class="mod ${blank}">${esc(mod||".")}</td><td>${esc(r.topic)}</td></tr>`;
  }).join("");

  document.getElementById("emptyState").hidden = flat.length>0;
  document.querySelector("table").style.display = flat.length ? "" : "none";

  const rows = chosen.reduce((n,t)=>n+t.rows.length,0);
  document.getElementById("previewMeta").textContent =
    `${chosen.length} ${chosen.length===1?"specialty":"specialties"} \u00b7 ${rows} topics`;
  document.getElementById("stat").textContent =
    `${selected.size} of ${TABS.length} selected \u00b7 ${rows} of ${totalRows} topics`;
  document.getElementById("exportBtn").disabled = flat.length===0;
}

function sync(){ renderPreview(); }

/* ================= PDF generation (jsPDF) =================
   Produces a real .pdf download — works in WhatsApp's in-app
   browser, where window.print() does not exist.
   Layout mirrors the standard Eremedium export (US Letter).      */

const L = {PW:612, PH:792, ML:79, MR:79, MT:51, MB:51,
           ROW:15, BANNER:20, THEAD:22, LOGO:17, DOCPAD:20};
L.CW     = L.PW - L.ML - L.MR;      /* 454 */
L.MOD    = L.CW * 0.35;
L.TOP    = L.CW * 0.65;
L.BOTTOM = L.PH - L.MB;             /* 741 */

const BLUE  = [27, 79, 145];
const GREEN = [61, 107, 31];

/* jsPDF UMD exposes window.jspdf.jsPDF */
const JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;

function loadImg(src){
  return new Promise(res=>{
    const i = new Image();
    i.onload  = ()=>res(i);
    i.onerror = ()=>res(null);
    i.src = src;
  });
}

/* group rows so the Module cell can be merged over its topics */
function groupsOf(rows){
  const out = []; let cur = null;
  rows.forEach(([m, t])=>{
    if(m){ cur = {mod:m, topics:[]}; out.push(cur); }
    if(!cur){ cur = {mod:"", topics:[]}; out.push(cur); }
    cur.topics.push(t);
  });
  return out;
}

function centeredMod(doc, mod, y, h){
  if(!mod) return;
  doc.setFont("times", "bold").setFontSize(10).setTextColor(0, 0, 0);
  const lines = doc.splitTextToSize(mod, L.MOD - 8);
  const lh = 11;
  let ty = y + h/2 - (lines.length - 1) * lh / 2 + 3.5;
  lines.forEach(ln => { doc.text(ln, L.ML + L.MOD/2, ty, {align:"center"}); ty += lh; });
}

function pageHead(doc, name, logo){
  let y = L.MT;
  if(logo){
    const h = L.LOGO;
    const w = h * (logo.naturalWidth / logo.naturalHeight);
    doc.addImage(logo.src, "PNG", L.ML, y - h + 5, w, h);
  }
  doc.setFont("times", "bold").setFontSize(13).setTextColor(0, 0, 0);
  doc.text("Eremedium Private Limited", L.ML + L.CW/2, y, {align:"center"});
  y += L.DOCPAD;

  /* specialty banner */
  doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]).setTextColor(255, 255, 255);
  doc.rect(L.ML, y, L.CW, L.BANNER, "F");
  doc.setDrawColor(0, 0, 0).setLineWidth(.5).rect(L.ML, y, L.CW, L.BANNER);
  doc.setFont("times", "bold").setFontSize(12);
  doc.text(name, L.ML + L.CW/2, y + L.BANNER/2 + 4, {align:"center"});
  y += L.BANNER;

  /* green column header */
  doc.setFillColor(GREEN[0], GREEN[1], GREEN[2]);
  doc.rect(L.ML, y, L.CW, L.THEAD, "F");
  doc.setDrawColor(0, 0, 0).setLineWidth(.5);
  doc.rect(L.ML, y, L.CW, L.THEAD);
  doc.line(L.ML + L.MOD, y, L.ML + L.MOD, y + L.THEAD);
  doc.setFont("times", "bold").setFontSize(11).setTextColor(255, 255, 255);
  doc.text("Module", L.ML + L.MOD/2, y + L.THEAD/2 + 4, {align:"center"});
  doc.text("Topic",  L.ML + L.MOD + L.TOP/2, y + L.THEAD/2 + 4, {align:"center"});
  return y + L.THEAD;
}

function topicRow(doc, mod, topic, y, merged){
  doc.setDrawColor(0, 0, 0).setLineWidth(.5);
  if(!merged) doc.rect(L.ML, y, L.MOD, L.ROW);
  doc.rect(L.ML + L.MOD, y, L.TOP, L.ROW);
  if(!merged) centeredMod(doc, mod, y, L.ROW);
  doc.setFont("times", "normal").setFontSize(11).setTextColor(0, 0, 0);
  doc.text(topic, L.ML + L.MOD + 5, y + L.ROW/2 + 3.8);
}

async function makePdf(chosen, label){
  const doc  = new JsPDF({unit:"pt", format:"letter", compress:true});
  const logo = await loadImg("icons/eremedium-logo@3x.png");

  chosen.forEach((t, ti)=>{
    if(ti > 0) doc.addPage();
    let y = pageHead(doc, t.name, logo);

    groupsOf(t.rows).forEach(g=>{
      const h         = g.topics.length * L.ROW;
      const fitsHere  = y + h <= L.BOTTOM;
      const fitsFresh = h <= (L.BOTTOM - L.MT);
      if(!fitsHere && fitsFresh){ doc.addPage(); y = L.MT; }

      if(y + h <= L.BOTTOM){
        /* module cell merged across the whole group */
        doc.setDrawColor(0, 0, 0).setLineWidth(.5).rect(L.ML, y, L.MOD, h);
        centeredMod(doc, g.mod, y, h);
        g.topics.forEach((tp, i)=> topicRow(doc, g.mod, tp, y + i * L.ROW, true));
        y += h;
      } else {
        /* group taller than a page: flow row by row, repeating the module */
        g.topics.forEach(tp=>{
          if(y + L.ROW > L.BOTTOM){ doc.addPage(); y = L.MT; }
          topicRow(doc, g.mod, tp, y, false);
          y += L.ROW;
        });
      }
    });
  });

  const fname = String(label || "export")
    .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "") + ".pdf";
  window.__pdfDoc = doc;
  doc.save(fname);
  return fname;
}

async function runExport(which){
  const chosen = which === "all" ? TABS : TABS.filter(t=>selected.has(t.name));
  if(!chosen.length) return;
  const label = which === "all"
    ? `MedXplain - All Specialties (${TABS.length})`
    : (chosen.length === 1 ? chosen[0].name : `MedXplain (${chosen.length} specialties)`);

  const btn = document.getElementById(which === "all" ? "exportAllBtn" : "exportBtn");
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "Generating\u2026";
  try{
    await makePdf(chosen, label);
  }catch(e){
    console.error(e);
    alert("Could not generate the PDF: " + (e && e.message ? e.message : e));
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

document.getElementById("exportBtn").addEventListener("click", ()=>runExport("sel"));
document.getElementById("exportAllBtn").addEventListener("click", ()=>runExport("all"));
window.__makePdf = makePdf;

/* ---------- offline indicator ---------- */
const netDot = document.getElementById("netDot"), netText = document.getElementById("netText");
function netSync(){
  const on = navigator.onLine;
  netDot.classList.toggle("off", !on);
  netText.textContent = on ? "Online" : "Offline \u2014 still works";
}
addEventListener("online", netSync); addEventListener("offline", netSync); netSync();

/* ---------- install prompt ---------- */
let deferred = null;
const installBtn = document.getElementById("installBtn");
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installBtn.classList.add("show"); });
installBtn.addEventListener("click", async () => {
  if(!deferred) return;
  deferred.prompt();
  await deferred.userChoice;
  deferred = null; installBtn.classList.remove("show");
});
addEventListener("appinstalled", ()=>installBtn.classList.remove("show"));

/* ---------- service worker ---------- */
if("serviceWorker" in navigator){
  addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

renderPicker(); sync();
</script>
